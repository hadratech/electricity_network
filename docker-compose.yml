# ============================================================
# docker-compose.yml
# Electricity Network GIS Platform - Docker Compose Configuration
# Version: 2.0.0 (avec support multilingue)
# ============================================================

services:
  # ============================================================
  # PostgreSQL + PostGIS Database Service (Multilingual)
  # ============================================================
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: electricity_db
    restart: unless-stopped
    environment:
      # Database configuration
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-electricity_network}
      POSTGRES_INITDB_ARGS: "-E UTF8"
      
      # Timezone (Mauritania)
      TZ: ${TZ:-Africa/Nouakchott}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Persistent data storage
      - postgres_data:/var/lib/postgresql/data
      # GeoJSON data directory
      - ./GeoJson:/data/geojson:ro
      # Regional CSV imported by 08-regional-access.sql during first initialization
      - ./1411-Donnees_recues/ministere_energies_petrole/03_valide:/workspace/1411-Donnees_recues/ministere_energies_petrole/03_valide:ro
    networks:
      - electricity_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-electricity_network}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-2G}
        reservations:
          memory: ${POSTGRES_MEMORY_RESERVATION:-1G}
    labels:
      - "com.electricity-network.description=PostgreSQL/PostGIS Database with Multilingual Support"
      - "com.electricity-network.service=database"

  # ============================================================
  # Node.js REST API Service (Multilingual)
  # ============================================================
  api:
    image: node:18-alpine
    container_name: electricity_api
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm start"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${API_PORT:-3000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-electricity_network}
      DB_SSL: ${DB_SSL:-false}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Multilingual configuration
      DEFAULT_LANG: ${DEFAULT_LANG:-fr}
      SUPPORTED_LANGS: fr,ar,en
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./api:/app:ro
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - electricity_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-512M}
        reservations:
          memory: ${API_MEMORY_RESERVATION:-256M}
    labels:
      - "com.electricity-network.description=REST API Service (Multilingual)"
      - "com.electricity-network.service=api"

  # ============================================================
  # PGAdmin 4 (avec support UTF-8)
  # ============================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: electricity_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@electricity.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGADMIN_DISABLE_POSTFIX: 'True'
      PGADMIN_CONFIG_LANG: ${PGADMIN_LANG:-fr}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    networks:
      - electricity_network
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
    deploy:
      resources:
        limits:
          memory: ${PGADMIN_MEMORY_LIMIT:-256M}
        reservations:
          memory: ${PGADMIN_MEMORY_RESERVATION:-128M}
    labels:
      - "com.electricity-network.description=PGAdmin Database Management (UTF-8)"
      - "com.electricity-network.service=pgadmin"

  # ============================================================
  # Redis Cache (pour sessions multilingues)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: electricity_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - electricity_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-256M}
        reservations:
          memory: ${REDIS_MEMORY_RESERVATION:-128M}
    labels:
      - "com.electricity-network.description=Redis Cache for Multilingual Sessions"
      - "com.electricity-network.service=cache"

  # ============================================================
  # Web Interface avec support multilingue
  # ============================================================
  web:
    image: nginx:alpine
    container_name: electricity_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - api
    networks:
      - electricity_network
    environment:
      API_URL: ${API_URL:-http://localhost:3000}
      DEFAULT_LANG: ${DEFAULT_LANG:-fr}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: ${WEB_MEMORY_LIMIT:-128M}
        reservations:
          memory: ${WEB_MEMORY_RESERVATION:-64M}
    labels:
      - "com.electricity-network.description=Web Interface (Multilingual)"
      - "com.electricity-network.service=web"

  # ============================================================
  # GeoServer (optionnel - pour services WMS/WFS multilingues)
  # ============================================================
  geoserver:
    image: geoservercloud/geoserver:latest
    container_name: electricity_geoserver
    restart: unless-stopped
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_PASSWORD:-geoserver}
      # Support multilingue
      GEOSERVER_LANG: fr
      ENABLE_JSONP: "true"
    ports:
      - "${GEOSERVER_PORT:-8081}:8080"
    volumes:
      - geoserver_data:/opt/geoserver/data_dir
      - ./geoserver/data:/opt/geoserver/data_dir/custom
    depends_on:
      - postgres
    networks:
      - electricity_network
    deploy:
      resources:
        limits:
          memory: ${GEOSERVER_MEMORY_LIMIT:-1G}
        reservations:
          memory: ${GEOSERVER_MEMORY_RESERVATION:-512M}
    profiles:
      - geoserver
    labels:
      - "com.electricity-network.description=GeoServer (WMS/WFS with Multilingual Support)"
      - "com.electricity-network.service=geoserver"

# ============================================================
# Networks
# ============================================================
networks:
  electricity_network:
    name: electricity_network
    driver: bridge

# ============================================================
# Volumes (Persistent Storage)
# ============================================================
volumes:
  postgres_data:
    name: electricity_postgres_data
    driver: local
  pgadmin_data:
    name: electricity_pgadmin_data
    driver: local
  redis_data:
    name: electricity_redis_data
    driver: local
  geoserver_data:
    name: electricity_geoserver_data
    driver: local